<div class="space-y-6 animate-fade-in">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-extrabold text-white tracking-tight">League Standings</h1>
  </div>

  <div class="bg-brand-card rounded-xl border border-gray-800 overflow-hidden shadow-xl">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-800">
        <thead class="bg-gray-800/80">
          <tr>
            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider w-16">Pos</th>
            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Team</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider" title="Games Played">GP</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider" title="Wins">W</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider" title="Losses">L</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider" title="Win Percentage">PCT</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider hidden md:table-cell" title="Points For">PF</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider hidden md:table-cell" title="Points Against">PA</th>
            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider" title="Point Differential">DIFF</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
          <tr *ngFor="let team of standings; let i = index" class="hover:bg-gray-800/30 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-300">
              {{ i + 1 }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center space-x-3">
                <img *ngIf="team.teamLogoUrl" [src]="team.teamLogoUrl" class="w-8 h-8 object-contain">
                <span class="text-sm font-bold text-white">{{ team.teamName }}</span>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-300">
              {{ team.gamesPlayed }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-semibold text-green-400">
              {{ team.wins }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-semibold text-red-400">
              {{ team.losses }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-bold text-brand-accent">
              {{ team.winPercentage | number:'1.3-3' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-400 hidden md:table-cell">
              {{ team.pointsFor }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-400 hidden md:table-cell">
              {{ team.pointsAgainst }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium" [ngClass]="team.pointDifferential > 0 ? 'text-green-400' : (team.pointDifferential < 0 ? 'text-red-400' : 'text-gray-400')">
              <span *ngIf="team.pointDifferential > 0">+</span>{{ team.pointDifferential }}
            </td>
          </tr>
        </tbody>
      </table>
      
      <div *ngIf="standings.length === 0" class="p-10 text-center text-gray-500">
        <p>No standings available.</p>
      </div>
    </div>
  </div>
</div>
