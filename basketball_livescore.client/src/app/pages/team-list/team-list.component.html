<div class="space-y-8 animate-fade-in">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-extrabold text-white tracking-tight">Teams</h1>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div *ngFor="let team of teams" 
         [routerLink]="['/teams', team.id]"
         class="bg-brand-card rounded-2xl overflow-hidden border border-gray-700 hover:border-brand-accent transition-all hover:-translate-y-1 cursor-pointer shadow-lg group">
      
      <div class="h-24" [style.backgroundColor]="team.primaryColor || '#1e293b'"></div>
      
      <div class="px-6 pb-6 relative">
        <div class="w-20 h-20 mx-auto -mt-10 bg-brand-dark rounded-full flex items-center justify-center border-4 border-brand-card overflow-hidden shadow-inner group-hover:scale-105 transition-transform">
          <img *ngIf="team.logoUrl" [src]="team.logoUrl" class="w-12 h-12 object-contain">
          <span *ngIf="!team.logoUrl" class="text-2xl">🏀</span>
        </div>
        
        <div class="text-center mt-4">
          <h3 class="text-xl font-bold text-white group-hover:text-brand-accent transition-colors">{{ team.name }}</h3>
          <p class="text-sm text-gray-400 mt-1">{{ team.city || 'Unknown City' }}</p>
        </div>
        
        <div class="mt-6 border-t border-gray-700 pt-4 text-center">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Coach</span>
          <p class="text-sm font-semibold text-gray-300 mt-1">{{ team.coachName || 'N/A' }}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="teams.length === 0" class="text-center p-12 bg-brand-card rounded-xl border border-gray-800">
    <p class="text-gray-400">No teams found.</p>
  </div>
</div>
