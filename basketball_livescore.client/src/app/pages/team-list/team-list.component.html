<div class="space-y-8 animate-fade-in py-4">
  <div class="flex justify-between items-end border-b border-brand-border pb-4">
    <h1 class="text-4xl font-sports tracking-wider uppercase text-brand-text font-bold">Teams</h1>
  </div>

  <div *ngIf="teams.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <a *ngFor="let team of teams; trackBy: trackByTeamId" 
       [routerLink]="['/teams', team.id]" 
       class="group bg-brand-card rounded-sm border-t-4 border-t-brand-accent border-l border-r border-b border-brand-border hover:border-brand-accent/50 transition-all shadow-md hover:shadow-glow overflow-hidden flex flex-col relative">
      
      <div class="absolute inset-0 bg-gradient-to-br from-brand-accent/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

      <div class="p-6 flex-1 flex flex-col items-center text-center relative z-10">
        <div class="w-24 h-24 bg-brand-dark/20 rounded-full flex items-center justify-center p-2 mb-4 border border-brand-border group-hover:scale-110 transition-transform duration-300">
           <img *ngIf="team.logoUrl" [src]="team.logoUrl" class="w-16 h-16 object-contain">
           <span *ngIf="!team.logoUrl" class="text-4xl">🏀</span>
        </div>
        <div class="flex-1">
          <h3 class="text-2xl font-sports uppercase tracking-wider font-bold text-brand-text group-hover:text-brand-accent transition-colors">{{ team.name }}</h3>
          <p class="text-sm font-sports uppercase tracking-widest text-brand-text-muted font-bold mt-1">{{ team.city || 'Unknown City' }}</p>
        </div>
      </div>
      <div class="bg-brand-dark/40 py-3 px-6 border-t border-brand-border flex justify-between items-center z-10">
        <div class="flex flex-col text-left">
          <span class="text-xs font-sports uppercase tracking-widest text-brand-text-muted font-bold">Head Coach</span>
          <span class="text-sm font-sports uppercase tracking-wider text-brand-text font-bold mt-1">{{ team.coachName || 'N/A' }}</span>
        </div>
      </div>
    </a>
  </div>

  <div *ngIf="teams.length === 0" class="text-center p-12 bg-brand-card/50 rounded-sm border border-brand-border border-dashed">
    <p class="text-brand-text-muted font-sports text-xl uppercase tracking-widest">No teams found.</p>
  </div>
</div>
