<div class="min-h-screen flex flex-col bg-brand-dark text-brand-light">
  
  <!-- Navbar -->
  <nav class="bg-brand-card shadow-lg border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center">
            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-accent to-yellow-500">🏀 LiveScore</span>
          </div>
          <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
            <a routerLink="/" routerLinkActive="border-brand-accent text-white" [routerLinkActiveOptions]="{exact: true}"
               class="border-transparent text-gray-300 hover:border-gray-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
              Live Matches
            </a>
            <a routerLink="/standings" routerLinkActive="border-brand-accent text-white"
               class="border-transparent text-gray-300 hover:border-gray-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
              Standings
            </a>
            <a routerLink="/teams" routerLinkActive="border-brand-accent text-white"
               class="border-transparent text-gray-300 hover:border-gray-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
              Teams
            </a>
          </div>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:items-center">
          <ng-container *ngIf="authService.currentUser | async as user; else loginTpl">
            <span class="text-sm text-gray-300 mr-4">{{ user.email }}</span>
            <button (click)="logout()" class="text-sm font-medium text-brand-accent hover:text-orange-400 transition-colors">
              Logout
            </button>
          </ng-container>
          <ng-template #loginTpl>
            <a routerLink="/login" class="text-sm font-medium text-brand-accent hover:text-orange-400 transition-colors">
              Encoder Login
            </a>
          </ng-template>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-brand-card border-t border-gray-800 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
      &copy; 2024 Basketball LiveScore. All rights reserved.
    </div>
  </footer>
</div>
