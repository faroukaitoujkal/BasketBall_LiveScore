<div class="min-h-screen flex flex-col bg-brand-dark text-brand-light font-sans selection:bg-brand-accent selection:text-white">
  
  <!-- Navbar -->
  <header class="bg-brand-dark/95 backdrop-blur-sm border-b border-brand-border sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo & Navigation -->
        <div class="flex items-center space-x-8">
          <div class="flex-shrink-0 flex items-center space-x-3">
            <img src="https://cdn.nba.com/logos/leagues/logo-nba.svg" alt="NBA Logo" class="h-10 w-auto object-contain drop-shadow-md">
            <a routerLink="/" class="font-sports text-2xl font-black text-brand-text tracking-tighter uppercase flex items-center">
              <span class="text-brand-accent mr-1 drop-shadow-sm">LIVE</span>SCORE
            </a>
          </div>
          
          <!-- Navigation Links -->
          <div class="hidden md:flex space-x-1">
            <a routerLink="/" routerLinkActive="text-brand-text bg-brand-dark" [routerLinkActiveOptions]="{exact: true}"
               class="text-brand-text-muted hover:text-brand-text hover:bg-brand-dark/50 px-4 py-2 rounded-md font-sports text-lg tracking-wider uppercase transition-colors">
              {{ 'NAV.MATCHES' | translate }}
            </a>
            <a routerLink="/standings" routerLinkActive="text-brand-text bg-brand-dark"
               class="text-brand-text-muted hover:text-brand-text hover:bg-brand-dark/50 px-4 py-2 rounded-md font-sports text-lg tracking-wider uppercase transition-colors">
              {{ 'NAV.STANDINGS' | translate }}
            </a>
          </div>
        </div>

        <!-- Auth & Settings -->
        <div class="flex items-center space-x-4">
          <!-- Theme Toggle -->
          <button (click)="themeService.toggleTheme()" class="p-2 rounded-sm bg-brand-card hover:bg-brand-card-hover border border-brand-border text-brand-text transition-colors" title="Toggle Theme">
            <svg *ngIf="themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg *ngIf="!themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>

          <!-- Language Switcher -->
          <select #langSelect (change)="switchLanguage(langSelect.value)" class="bg-brand-card text-brand-text text-sm font-sports uppercase tracking-widest font-bold border border-brand-border rounded-sm py-1.5 px-3 focus:outline-none focus:border-brand-accent">
            <option value="fr" [selected]="translate.currentLang === 'fr'">FR</option>
            <option value="en" [selected]="translate.currentLang === 'en'">EN</option>
          </select>

          <ng-container *ngIf="authService.currentUser | async as user">
            <div class="flex items-center space-x-2">
              <div class="hidden sm:flex flex-col text-right">
                <span class="text-xs text-brand-text-muted uppercase font-bold tracking-widest">Encoder</span>
                <span class="text-sm text-brand-text font-bold leading-none">{{ user.email }}</span>
              </div>
              <button (click)="logout()" class="p-2 text-brand-danger hover:text-brand-danger/80 transition-colors ml-2" [title]="'NAV.LOGOUT' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 w-full max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-brand-card mt-auto border-t border-brand-border">
    <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col items-center">
      <span class="font-sports text-2xl tracking-widest uppercase text-brand-text font-bold mb-4">LiveScore</span>
      <p class="text-sm text-brand-text-muted font-medium">
        &copy; 2024 Basketball LiveScore. All rights reserved.
      </p>
    </div>
  </footer>
</div>
